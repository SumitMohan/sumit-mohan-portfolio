<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Transparent background is guaranteed by not including a background rect -->
  
  <g transform="translate(40, 100)" filter="url(#glow)">
    <!-- Stylized S -->
    <path d="M 40 40 L 160 40 C 220 40 220 120 160 120 L 80 120 C 20 120 20 200 80 200 L 200 200" 
          fill="none" stroke="url(#logo-gradient)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stylized M (connected/interlocking feel) -->
    <path d="M 180 280 L 180 60 L 260 200 L 340 60 L 340 280" 
          fill="none" stroke="#fff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
