<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background: Rounded Square with Deep Slate Gradient -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#grad)" />
  
  <!-- Monogram: SM -->
  <!-- Using a geometric path construction for a custom modern feel instead of relying on system fonts -->
  <g transform="translate(106, 156)">
    <!-- S Shape -->
    <path d="M 60 0 L 180 0 Q 240 0 240 60 L 240 70 Q 240 100 210 100 L 90 100 Q 60 100 60 130 L 60 140 Q 60 170 90 170 L 240 170" 
          fill="none" stroke="white" stroke-width="45" stroke-linecap="round" />
          
    <!-- M Shape (Overlapping/Interlocking style) -->
    <path d="M 120 200 L 120 60 L 195 200 L 270 60 L 270 200" 
          fill="none" stroke="#0ea5e9" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
