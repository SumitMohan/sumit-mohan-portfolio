<svg viewBox="-150 -170 300 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Layer (Cyan) -->
    <linearGradient id="layerTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#147BFF"/>
    </linearGradient>
    
    <!-- Middle Layer (Blue/Purple) -->
    <linearGradient id="layerMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#147BFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Bottom Layer (Purple/Pink) -->
    <linearGradient id="layerBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#E83AA8"/>
    </linearGradient>

    <!-- Edge Highlighting -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Brilliant Glow for the top layer -->
    <filter id="topGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00F0FF" flood-opacity="0.4"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Group (Perfectly Centered) -->
  <g>
    <!-- 1. Bottom Layer (Data) -->
    <g transform="translate(0, 60)" filter="url(#deepShadow)">
      <polygon points="0,-60 120,0 0,60 -120,0" fill="url(#layerBot)" stroke="url(#layerBot)" stroke-width="8" stroke-linejoin="round"/>
      <polygon points="0,-60 120,0 0,60 -120,0" fill="none" stroke="url(#edgeHighlight)" stroke-width="2.5" stroke-linejoin="round" opacity="0.6"/>
    </g>

    <!-- 2. Middle Layer (Model / Logic) -->
    <g transform="translate(0, 0)" filter="url(#deepShadow)">
      <polygon points="0,-60 120,0 0,60 -120,0" fill="url(#layerMid)" stroke="url(#layerMid)" stroke-width="8" stroke-linejoin="round"/>
      <polygon points="0,-60 120,0 0,60 -120,0" fill="none" stroke="url(#edgeHighlight)" stroke-width="2.5" stroke-linejoin="round" opacity="0.8"/>
    </g>

    <!-- 3. Top Layer (Application / UI) -->
    <g transform="translate(0, -60)" filter="url(#topGlow)">
      <polygon points="0,-60 120,0 0,60 -120,0" fill="url(#layerTop)" stroke="url(#layerTop)" stroke-width="8" stroke-linejoin="round"/>
      <!-- Top shine -->
      <polygon points="0,-60 120,0 0,60 -120,0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
    </g>

  </g>
</svg>
